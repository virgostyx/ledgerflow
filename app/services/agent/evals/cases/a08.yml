- id: A08-015
  capability: A08
  language: en
  tags:
  - diagnosis
  - tool_choice
  - priority
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: What should I fix first?
  script:
  - tool: get_consistency_findings
    args:
      prioritize: true
  - say: 'Here is the order, with the reason of each rank:

      1. C11 (invariant I6): blocking, it blocks the closing, and the balance sheet does not balance [[ref:R19:{{ids.finding_i6}}]].

      2. C06: blocking, a validated line sits on an archived account [[ref:R19:{{ids.finding_c06}}]].

      3. C14: a warning on the largest amount, a customer without a VAT number [[ref:R19:{{ids.finding_c14}}]].

      4. C04: a warning on a debit balance on the suppliers account [[ref:R19:{{ids.finding_c04}}]].

      5. C05: a probable duplicate invoice [[ref:R19:{{ids.finding_c05}}]].

      Four more are open (C09, C03, and the ones after): ask for the next ones.'
  expect:
    tools:
    - name: get_consistency_findings
      args:
        prioritize: true
    citations:
    - 'R19:'
    answer_includes:
    - blocking
    - C11
    - C06
    - C14
- id: A08-016
  capability: A08
  language: fr
  tags:
  - diagnosis
  - tool_choice
  - priority
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: Que dois-je corriger en premier ?
  script:
  - tool: get_consistency_findings
    args:
      prioritize: true
  - say: 'Voici l''ordre, avec la raison de chaque rang :

      1. C11 (invariant I6) : bloquant, il bloque la clôture, et le bilan ne s''équilibre pas [[ref:R19:{{ids.finding_i6}}]].

