  - tool_choice
  - cause
  - anomaly
  - calculation
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: Explain R19:{{ids.finding_c09}}, and give the difference.
  script:
  - tool: get_finding_context
    args:
      finding_id: '{{ids.finding_c09}}'
  - tool: calculate
    args:
      operation: difference
      values:
      - '{{facts.an_c09_booked}}'
      - '{{facts.an_c09_expected}}'
  - say: 'The VAT of invoice ACH2026/0001 is {{facts.an_c09_booked}} EUR where base times rate gives {{facts.an_c09_expected}} EUR, a difference of {{facts.an_c09_difference}} EUR [[ref:R19:{{ids.finding_c09}}]].


      **Established**: the booked VAT exceeds base times rate by {{facts.an_c09_difference}} EUR, more than the tolerance of five cents. **Hypothesis**: the VAT amount was typed by hand, or a line carries a wrong rate, to confirm by opening the invoice.


      How to correct:

      1. Open the invoice; if it is posted, reverse it and post it again with the right VAT [[ref:screen:journal]].

      2. If the VAT return of the period was filed, correct it in the next return [[ref:screen:vat]].


      There is no validated diagnostic protocol for this check: this is a general approach.'
  expect:
    tools:
    - name: get_finding_context
      args:
        finding_id: '{{ids.finding_c09}}'
    - name: calculate
    citations:
    - 'R19:'
    - 'screen:'
    labels:
    - established
    - hypothesis
    amounts:
    - '{{facts.an_c09_booked}}'
    - '{{facts.an_c09_expected}}'
    - '{{facts.an_c09_difference}}'
    answer_includes:
    - no validated diagnostic protocol
    - tolerance
