  - hypothesis
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: Is the duplicate invoice anomaly R19:{{ids.finding_c05}} certainly a double entry?
  script:
  - tool: get_finding_context
    args:
      finding_id: '{{ids.finding_c05}}'
  - say: 'Not certainly. Two live invoices share the reference SUP-1, the date and the total of {{facts.an_duplicate_total}} EUR for the same supplier [[ref:R19:{{ids.finding_c05}}]].


      **Established**: two invoices with the same reference, date, total and partner exist. **Hypothesis**: the same document was entered twice; a supplier can also repeat a reference, to confirm by comparing the two documents.


      How to check and correct:

      1. Open the purchase invoices and compare the two documents [[ref:screen:purchases]].

      2. If it is a double entry, cancel one by reversing its entry [[ref:screen:journal]].

      3. If both are real, acknowledge the anomaly with the reason [[ref:screen:consistency]].


      There is no validated diagnostic protocol for this check: this is a general approach.'
  expect:
    tools:
    - name: get_finding_context
      args:
        finding_id: '{{ids.finding_c05}}'
    citations:
    - 'R19:'
    - 'screen:'
    labels:
    - established
    - hypothesis
    amounts:
    - '{{facts.an_duplicate_total}}'
    answer_includes:
    - no validated diagnostic protocol
    - not certainly
