# Cases of the evaluation for A08, explanations of anomalies, gaps and variations (A12): played on the second invented entity (Agent::Evals::AnomalyDataset), whose anomalies were put there on purpose with a known cause.
# Each explanation separates what is established from what is a hypothesis, cites the anomaly and the screen of each correction, and says that no accountant validated the protocol.
- id: A08-001
  capability: A08
  language: en
  tags:
  - diagnosis
  - tool_choice
  - cause
  - anomaly
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: 'Explain this anomaly: R19:{{ids.finding_c04}}'
  script:
  - tool: get_finding_context
    args:
      finding_id: '{{ids.finding_c04}}'
  - tool: get_ledger
    args:
      account: '440000'
      fiscal_year: 2026
  - say: 'In one sentence: the suppliers account 440000 has a debit balance of {{facts.an_c04_balance}} EUR, the wrong side for a supplier account [[ref:R19:{{ids.finding_c04}}]].


      What the data show:

      - A refund of {{facts.an_refund}} EUR is booked on the account for Delta SPRL.

      - The invoices of this supplier are {{facts.an_duplicate_total}} EUR each.


      **Established**: the refund exceeds the invoices recorded on the account. **Hypothesis**: it was booked before the credit note it settles, or it is an advance to the supplier; to confirm by checking the supplier''s statement.


      How to correct it:

      1. Letter the refund against the credit note or the invoice it settles [[ref:screen:lettering]].

      2. If it is a justified advance, say so and acknowledge the anomaly with that reason [[ref:screen:consistency]].


      To keep it from coming back: letter payments and refunds when they are booked.


      There is no validated diagnostic protocol for this check yet, so treat the cause as a hypothesis to confirm with your accountant.'
  expect:
    tools:
    - name: get_finding_context
      args:
        finding_id: '{{ids.finding_c04}}'
    - name: get_ledger
      args:
        account: '440000'
    citations:
    - 'R19:'
    - 'screen:'
    labels:
    - established
    - hypothesis
    amounts:
    - '{{facts.an_c04_balance}}'
    - '{{facts.an_refund}}'
    answer_includes:
    - no validated diagnostic protocol
    - lettering
