  - diagnosis
  - tool_choice
  - variation
  - cause
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: Why did the cost of account 611000 rise between the first and the second quarter?
  script:
  - tool: get_finding_context
    args:
      protocol_id: variation
  - tool: get_variation
    args:
      account_prefix: '611'
      first_from: '2026-01-01'
      first_to: '2026-03-31'
      second_from: '2026-04-01'
      second_to: '2026-06-30'
      group_by: month
  - say: 'The cost rose from {{facts.an_first_quarter}} EUR to {{facts.an_second_quarter}} EUR, a change of {{facts.an_cost_change}} EUR.


      **Established**: June carries the change; it holds a single line of {{facts.an_oneoff}} EUR, which explains the whole of the change, so it is a one-off and not a trend. The other months are the same as in the first quarter. The two quarters have almost the same length (90 and 91 days).

      **Hypothesis**: an annual or exceptional cost booked in June, to confirm by opening that line.


      To check: open the ledger of the account for June [[ref:screen:journal]].


      There is no validated diagnostic protocol for a variation: this is the general method, so the cause is a hypothesis.'
  expect:
    tools:
    - name: get_finding_context
      args:
        protocol_id: variation
    - name: get_variation
      args:
        account_prefix: '611'
        group_by: month
    citations:
    - 'screen:'
    labels:
    - established
    - hypothesis
    amounts:
    - '{{facts.an_first_quarter}}'
    - '{{facts.an_second_quarter}}'
    - '{{facts.an_cost_change}}'
    - '{{facts.an_oneoff}}'
    answer_includes:
    - one-off
    - no validated diagnostic protocol
