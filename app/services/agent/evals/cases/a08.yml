  input: 'The balance sheet does not balance: explain R19:{{ids.finding_i6}}'
  script:
  - tool: get_finding_context
    args:
      finding_id: '{{ids.finding_i6}}'
  - tool: get_trial_balance
    args:
      account_prefix: '799999'
  - say: 'Assets and liabilities differ by {{facts.an_unmapped_balance}} EUR for 2026 [[ref:R19:{{ids.finding_i6}}]].


      **Established**: the trial balance shows account 799999 with a credit balance of {{facts.an_unmapped_balance}} EUR, equal to the difference. **Hypothesis**: the account is attached to no rubric of the income statement, so its balance is missing from the result; to confirm by reading the income statement.


      How to correct:

      1. Map the account to its rubric, or move its balance to an account of the standard chart [[ref:screen:accounts]].


      To keep it from coming back: create accounts from the standard chart.


      There is no validated diagnostic protocol for the check, but the invariant I6 has a general approach, followed here.'
