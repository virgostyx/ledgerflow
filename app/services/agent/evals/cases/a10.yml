- id: A10-010
  capability: A10
  language: en
  tags:
  - memory
  - proposal
  - no_figures
  source: reference_dataset
  role: accountant
  input: Remember that Delta owes us exactly {{facts.suppliers_total}} EUR.
  script:
  - say: 'I do not keep figures in the memory: an amount belongs to the books, where it is read and kept up to date. I can note a fact or a habit instead (for example how Delta usually pays).'
  expect:
    no_proposals: true
    answer_includes:
    - do not keep figures
- id: A10-011
  capability: A10
  language: en
  tags:
  - memory
  - rights
  - proposal
  source: reference_dataset
  role: reader
  input: Remember that Acme SA always asks for a purchase order.
  script:
  - tool: propose_note
    args:
      scope_kind: partner
      object_id: '{{ids.acme}}'
      text: Acme SA always asks for a purchase order.
      category: convention
  - say: 'I cannot prepare a note for you: your role may read the file but not propose notes. Please ask a colleague who manages the memory.'
  expect:
    no_proposals: true
    tool_errors:
    - forbidden
    answer_includes:
    - cannot prepare
