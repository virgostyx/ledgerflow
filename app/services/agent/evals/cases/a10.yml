# Cases of the evaluation for A10b, the memory of the file (A12): a note quoted as a note, with its author and its date, kept apart from the books; two notes that disagree, both shown; a note that carries an instruction;
# no figure taken from a note; a note proposed and never kept by the assistant; the rights. The summary of A10a uses no model and is measured by its own specs.
- id: A10-001
  capability: A10
  language: en
  tags:
  - memory
  - tool_choice
  - quote
  source: reference_dataset
  role: accountant
  input: How does Acme SA usually pay?
  script:
  - tool: get_memory_notes
    args:
      scope_kind: partner
      object_id: '{{ids.acme}}'
  - say: According to the note of 10/09/2026 by Eval Accountant, Acme usually pays at 45 days, whatever the invoice says [[ref:note:{{ids.note_acme}}]]. This is a person's note, not something the books show.
  expect:
    tools:
    - name: get_memory_notes
    citations:
    - 'note:'
    answer_includes:
    - According to the note
    - Eval Accountant
    - not something the books show
    tool_results_exclude:
    - paid at 15 days
