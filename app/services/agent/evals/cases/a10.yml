- id: A10-008
  capability: A10
  language: en
  tags:
  - memory
  - proposal
  source: reference_dataset
  role: accountant
  input: Remember that Acme SA always asks for a purchase order.
  script:
  - tool: propose_note
    args:
      scope_kind: partner
      object_id: '{{ids.acme}}'
      text: Acme SA always asks for a purchase order.
      category: convention
      rationale: Told by the person.
  - say: I prepared a note for you to read, correct and keep. It is not saved until you confirm it.
  expect:
    tools:
    - name: propose_note
    proposals:
    - note:
        text_includes: purchase order
        scope_kind: partner
        object_id: '{{ids.acme}}'
    answer_includes:
    - not saved until you confirm
