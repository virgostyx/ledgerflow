# Cases of the evaluation for A06, questions of method answered from the knowledge base (A12): the right passage found, the rule in force on the date of the operation, the level of certainty stated, no legal
# reference that no passage gave, nothing of another entity, a refusal of tax or legal advice, and a passage that tries to give orders. The notes are those of Agent::Evals::Dataset::KNOWLEDGE (invented).
- id: A06-001
  capability: A06
  language: en
  tags:
  - knowledge
  - tool_choice
  - grounded
  - accounts
  source: reference_dataset
  role: accountant
  input: How do I book an annual insurance premium that I paid in advance?
  script:
  - tool: search_knowledge
    args:
      query: insurance premium paid in advance prepayment
  - tool: search_accounts
    args:
      q: '490000'
  - say: 'Book it on a prepayment account and spread it over the months it covers. | Account | Label | Debit/Credit | VAT |

      | 490000 | Deferred charges | Debit | none |

      Basis: Prepayments and accruals handbook, version 1, in force from 01/01/2020 [[ref:kb:doc-{{ids.kb_prepayments}}:p-1]], article 12 of the firm handbook.

      Certainty: Confirmed by the knowledge base.'
  expect:
    tools:
    - name: search_knowledge
    - name: search_accounts
    citations:
    - kb:doc-
    certainty: confirmed
    answer_includes:
    - version 1
    - 01/01/2020
    - '490000'
    tool_results_include:
    - Prepayments and accruals handbook
    flags: []
