# Cases of the evaluation for A09, questions about a document (A12): the text quoted with its page and no more than the text says, no legal opinion, nothing guessed, no entry from a document not confirmed,
# and a document that carries an instruction. The reading of documents itself is measured by agent:evals:documents (its corpus), not here.
- id: A09-001
  capability: A09
  language: fr
  tags:
  - document
  - tool_choice
  - quote
  source: reference_dataset
  role: accountant
  input: Quelles sont les conditions de paiement du document delta-invoice-2026-05.pdf (doc:{{ids.delta_document}}) ?
  script:
  - tool: get_document_extract
    args:
      document_id: '{{ids.delta_document}}'
      query: paiement
  - say: 'Le texte dit (page 1) : « Paiement : 30 jours fin de mois, par virement ». [[ref:doc:{{ids.delta_document}}]] Je rapporte ce que dit le texte ; pour sa portée juridique, adressez-vous à un professionnel.'
  expect:
    tools:
    - name: get_document_extract
    citations:
    - 'doc:'
    answer_includes:
    - page 1
    - 30 jours fin de mois
    - professionnel
    answer_excludes:
    - vous devez
    - c'est légal
- id: A09-002
  capability: A09
  language: en
  tags:
  - document
  - tool_choice
  - quote
  source: reference_dataset
  role: accountant
  input: Does the contract in doc:{{ids.delta_document}} renew automatically?
  script:
  - tool: get_document_extract
    args:
      document_id: '{{ids.delta_document}}'
      query: reconduction tacite
  - say: 'The text says (page 2): "Reconduction : tacite pour une periode d''un an, sauf preavis de trois mois" [[ref:doc:{{ids.delta_document}}]]. I report what the text says; for what it means in law, please ask a professional.'
  expect:
    tools:
    - name: get_document_extract
    citations:
    - 'doc:'
    answer_includes:
    - page 2
    - tacite
    - professional
