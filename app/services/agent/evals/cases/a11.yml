- id: A11-013
  capability: A11
  language: en
  tags:
  - writing
  - tool_choice
  - variation
  - grounding
  source: reference_dataset
  role: accountant
  dataset: anomalies
  input: Write the comment on the rise of the costs of account 611000 between the first and the second quarter, for the closing.
  script:
  - tool: get_variation
    args:
      account_prefix: '611'
      first_from: '2026-01-01'
      first_to: '2026-03-31'
      second_from: '2026-04-01'
      second_to: '2026-06-30'
      group_by: month
  - tool: propose_text
    args:
      kind: variation_comment
      language: en
      body: 'Costs of account 611000 rose from {{facts.an_first_quarter}} EUR to {{facts.an_second_quarter}} EUR, a change of {{facts.an_cost_change}} EUR.

        Established: June holds a single line of {{facts.an_oneoff}} EUR that explains the whole change.

        Hypothesis: an annual or exceptional cost booked in June, to confirm on the line.'
  - say: 'The comment is drafted, with what is established apart from the hypothesis. It is not sent or saved: you read it and use it.'
  expect:
    tools:
    - name: get_variation
    - name: propose_text
    texts:
    - kind: variation_comment
      includes:
      - Established
      - Hypothesis
      - '{{facts.an_cost_change}}'
