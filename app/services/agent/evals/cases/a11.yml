# Cases of the evaluation for A11, texts drafted for a person (A12): reminders from the lines of the books in three languages, no reminder for a line in dispute or not due, a figure that no tool gave replaced by a placeholder,
# nothing the policy does not allow, nothing of an internal note, a reply to an e-mail that carries an instruction, a rewrite, a comment on a variation, a campaign with its exclusions. Nothing is ever sent.
- id: A11-001
  capability: A11
  language: en
  tags:
  - writing
  - tool_choice
  - dunning
  source: reference_dataset
  role: accountant
  input: Write the payment reminder for Acme SA.
  script:
  - tool: get_writing_context
    args:
      partner_id: '{{ids.acme}}'
  - tool: propose_text
    args:
      kind: dunning_letter
      language: en
      body: 'Dear Acme SA,


        Our records show that the invoices below are overdue:

        - {{ids.acme_ref_1}}, due 2026-07-15: {{facts.acme_june_invoice}} EUR

        - {{ids.acme_ref_2}}, due 2026-09-19: {{facts.acme_august_invoice}} EUR


        Total overdue: {{facts.acme_total}} EUR. If you have already paid them, please disregard this message.


        Kind regards,

        The accounting team'
      subject: Payment reminder
      partner_id: '{{ids.acme}}'
      level: 1
      facts:
      - label: Total overdue
        value: '{{facts.acme_total}}'
        ref: partner:{{ids.acme}}
  - say: 'I wrote a first reminder for Acme SA from the overdue lines of the books. It is not sent: you read it, change it and use it in the reminders; I cannot send anything.'
  expect:
    tools:
    - name: get_writing_context
    - name: propose_text
    texts:
    - kind: dunning_letter
      partner_id: '{{ids.acme}}'
      includes:
      - '{{ids.acme_ref_1}}'
      - '{{ids.acme_ref_2}}'
      - '{{facts.acme_total}}'
      excludes:
      - interest
      - bailiff
      - intérêts
      - huissier
      - installment
      language: en
    answer_includes:
    - not sent
