# Cases of the evaluation for A05, questions about the books answered with figures that are cited and checked (A12). Demonstration data only; the figures are the facts of Agent::Evals::Dataset.
# Written from a table of question types (consultation, filtered list, receivables and payables, VAT, results, state of the file) in English, French and Dutch, and of the behaviours that matter:
# no budget, no future, out of scope, ambiguity, a partial result, nothing found, a right missing, relative dates, calculations through the calculate tool, and the failures of a model that the
# application must catch (an amount nobody gave, a source that does not exist, a calculation on invented amounts).
- id: A05-006
  capability: A05
  language: en
  tags:
  - figures
  - tool_choice
  source: reference_dataset
  role: accountant
  input: What is the balance of account 400000 at the end of September?
  script:
  - tool: get_trial_balance
    args:
      account_prefix: '400000'
  - say: At 30/09/2026, account 400000 (Customers) has a debit balance of {{facts.customers_total}} EUR [[ref:R01:{{ids.fiscal_year}}:2026-09-30]]. Validated entries only.
  expect:
    tools:
    - name: get_trial_balance
      args:
        account_prefix: '400000'
    amounts:
    - '{{facts.customers_total}}'
    citations:
    - 'R01:'
    answer_includes:
    - 30/09/2026
