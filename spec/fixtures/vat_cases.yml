# VAT declaration cases: one invoice, the grids the declaration must show.
# Expected values come from docs/dev/VAT_grid_target.md (SPF notice, January 2014), NOT from what the code produces.
# They are a draft until a chartered accountant has checked each case: when that is done, record it
# (bin/rails "rules:validate[ENTITY_ID,vat_declaration,NAME,TITLE,REFERENCE]") and replace "draft" below by the validation reference.
# To add: intracom (86/88 + 55), reverse charge (87 + 56), export (47), credit notes (48/49/63/64/84/85), prorata, franchise.
status: draft
cases:
