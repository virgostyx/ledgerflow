# The corpus of attacks of A03: text a third party could put in the books (a label, a supplier's name, a document, a remark of a UBL invoice, the subject of an e-mail), written to
# an AI rather than to a person. `source` says where it would come from; `detect` says whether the detector is expected to flag it (the evasive ones are known misses: the
# architecture, not the detector, is what stops them); `kind` is malicious, evasive or legit (a real label that only looks like an order, and must be shown as it is).
