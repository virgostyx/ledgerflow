<!doctype html>
<html lang="en">
  <head>
    <title>Browser not supported (406) — LedgerFlow</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff7ed; color: #292524;
             font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 28rem; }
      img { width: 56px; height: 56px; margin-bottom: 8px; }
      .brand { color: #c2410c; font-weight: 700; font-size: 1.25rem; margin-bottom: 32px; }
      .code { color: #ea580c; font-weight: 700; font-size: 3.5rem; line-height: 1; }
      h1 { font-size: 1.5rem; color: #9a3412; margin: 8px 0 12px; }
      p { color: #57534e; line-height: 1.5; margin-bottom: 28px; }
      a { display: inline-block; background: #ea580c; color: #fff; text-decoration: none; font-weight: 600; padding: 10px 24px; border-radius: 8px; }
      a:hover { background: #c2410c; }
      a:focus-visible { outline: 3px solid #9a3412; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="">
      <div class="brand">LedgerFlow</div>
      <div class="code" aria-hidden="true">406</div>
      <h1>Browser not supported</h1>
      <p>LedgerFlow needs a recent version of Chrome, Firefox, Safari or Edge. Please update your browser, then come back.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
