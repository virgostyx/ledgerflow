# Name of your application. Used to uniquely configure containers.
service: ledgerflow

# Name of the container image (private repository on Docker Hub).
image: virgostyx/ledgerflow

# Deploy to this server (dedicated to LedgerFlow).
servers:
  web:
    - 2.24.163.249

# Enable SSL auto certification via Let's Encrypt.
# Requires an A record for app.ledgerflowmanagment.com pointing at this server's IP
# BEFORE the first deploy (Let's Encrypt HTTP-01 challenge needs it to resolve).
# The DNS zone is at Hostinger (no CDN proxy in front): kamal-proxy sees the real IP of the visitors.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb
# (already enabled in config/environments/production.rb).
proxy:
  ssl: true
  host: app.ledgerflowmanagment.com

# Where you keep your container images.
registry:
  username: virgostyx
  password:
    - KAMAL_REGISTRY_PASSWORD

# The first start creates the four databases and loads structure.sql (db:prepare): give it time.
# Once the first deploy is done this can come back to the default (30).
deploy_timeout: 120

# Inject ENV variables into containers (secrets come from .kamal/secrets).
# Stage 1 (the firm only, portal closed): nothing is set for the portal, Peppol, the agent or the legacy integration.
env:
  secret:
    - RAILS_MASTER_KEY
    - LEDGERFLOW_DATABASE_PASSWORD
    - SMTP_PASSWORD
  clear:
    RAILS_ENV: production

    # Database configuration (uses the accessory PostgreSQL below)
    DB_HOST: ledgerflow-db

    # Public host of the application: links in the e-mails and allowed host.
    APP_HOST: app.ledgerflowmanagment.com

    # Outgoing mail: SMTP of the mailbox that is the sender (the host refuses another From).
    MAILER_FROM: no-reply@ledgerflowmanagment.com
    SMTP_ADDRESS: smtp.hostinger.com
    SMTP_PORT: 465
    SMTP_DOMAIN: ledgerflowmanagment.com
    SMTP_USERNAME: no-reply@ledgerflowmanagment.com

    # Private keys of the certificates of integrity: a host directory, outside the storage volume.
    LEDGER_SIGNING_KEY_DIR: /rails/signing_keys

    # Run the Solid Queue Supervisor inside the web process: no dedicated job server yet.
    SOLID_QUEUE_IN_PUMA: true

    WEB_CONCURRENCY: 1
    RAILS_MAX_THREADS: 5
    PORT: 3000

    RAILS_LOG_LEVEL: info

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Local Active Storage files, and the signing keys.
# /var/lib/ledgerflow/signing_keys must exist on the host before the first deploy:
# chown 1000:1000, chmod 700 (Docker would create it as root otherwise).
volumes:
  - "ledgerflow_storage:/rails/storage"
  - "/var/lib/ledgerflow/signing_keys:/rails/signing_keys"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH configuration of the dedicated server.
ssh:
  user: deploy
  port: 22

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:16-alpine
    host: 2.24.163.249
    port: "127.0.0.1:5432:5432"  # Local-only, not exposed publicly
    env:
      clear:
        POSTGRES_USER: ledgerflow
        POSTGRES_DB: ledgerflow_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      health-cmd: "pg_isready -U ledgerflow"
      health-interval: "10s"
      health-timeout: "5s"
      health-retries: 5
