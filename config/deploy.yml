# Name of your application. Used to uniquely configure containers.
service: ledgerflow

# Name of the container image (use your-user/app-name on external registries).
image: virgostyx/ledgerflow

# Deploy to these servers.
# Same physical server as BudgetFlow (kamal-proxy routes by hostname, so
# multiple apps can share one host — see proxy.host below).
servers:
  web:
    - budgetflow-production

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Requires an A record for ledgerflow.budgetflowmanagement.com pointing at this server's IP
# BEFORE the first deploy (Let's Encrypt HTTP-01 challenge needs it to resolve).
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb
# (already enabled in config/environments/production.rb).
proxy:
  ssl: true
  host: ledgerflow.budgetflowmanagement.com

# Where you keep your container images.
registry:
  # Same Docker Hub account as BudgetFlow. The "ledgerflow" repository must
  # exist (or be creatable) under this account before the first push.
  username: virgostyx
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - LEDGERFLOW_DATABASE_PASSWORD
  clear:
    RAILS_ENV: production

    # Database configuration (uses the accessory PostgreSQL below)
    DB_HOST: ledgerflow-db

    # Run the Solid Queue Supervisor inside the web process — traffic is low
    # (dev/testing use only for now), no need for a dedicated job server yet.
    SOLID_QUEUE_IN_PUMA: true

    # Kept deliberately low — single-user dev/testing traffic, not public yet.
    WEB_CONCURRENCY: 1
    RAILS_MAX_THREADS: 5
    PORT: 3000

    RAILS_LOG_LEVEL: info

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
volumes:
  - "ledgerflow_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH configuration — same custom user/port as BudgetFlow on this shared server.
ssh:
  user: deploy
  port: 2221

# Use accessory services (secrets come from .kamal/secrets).
# Separate PostgreSQL instance from BudgetFlow's — no shared database between
# the two apps. Host port 5433 (not 5432) to avoid colliding with BudgetFlow's
# own accessory on the same server.
accessories:
  db:
    image: postgres:16-alpine
    host: budgetflow-production
    port: "127.0.0.1:5433:5432"  # Local-only, not exposed publicly
    env:
      clear:
        POSTGRES_USER: ledgerflow
        POSTGRES_DB: ledgerflow_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      health-cmd: "pg_isready -U ledgerflow"
      health-interval: "10s"
      health-timeout: "5s"
      health-retries: 5
