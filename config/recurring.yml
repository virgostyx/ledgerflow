# Recurring tasks run by Solid Queue (inside Puma when SOLID_QUEUE_IN_PUMA is set). Development and test do not schedule
# anything: run a job by hand, e.g. `bin/rails runner 'Accounting::GenerateRecurringInvoicesJob.perform_now'`.
production:
  generate_recurring_invoices:
    class: Accounting::GenerateRecurringInvoicesJob
    queue: default
    schedule: every day at 5am
  consistency_checks:
    class: Accounting::ConsistencyCheckJob
    queue: default
    schedule: every day at 2am
  auto_reverse_entries:
    class: Accounting::AutoReverseEntriesJob
    queue: default
    schedule: every day at 4am
  suggest_letterings:
    class: Accounting::SuggestLetteringsJob
    queue: default
    schedule: every day at 1am
  relock_periods:
    class: Accounting::RelockPeriodsJob
    queue: default
    schedule: every 10 minutes
  verify_documents:
    class: Accounting::VerifyDocumentsJob
    queue: default
    schedule: every sunday at 3am
