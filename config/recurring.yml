# Recurring tasks run by Solid Queue (inside Puma when SOLID_QUEUE_IN_PUMA is set). Development and test do not schedule
# anything: run a job by hand, e.g. `bin/rails runner 'Accounting::GenerateRecurringInvoicesJob.perform_now'`.
production:
  approvals_digest:
    class: Approvals::DigestJob
    queue: default
    schedule: every day at 7:45am
  integrity_self_check_nightly:
    class: Integrity::SelfCheckJob
    args: [ nightly ]
    queue: default
    schedule: every day at 3:45am
  integrity_self_check_full:
    class: Integrity::SelfCheckJob
    args: [ full ]
    queue: default
    schedule: every sunday at 4:30am
  ledger_timestamp:
    class: Ledger::TimestampJob
    queue: default
    schedule: every hour
  ledger_anchor:
    class: Ledger::AnchorJob
    queue: default
    schedule: every day at 3:15am
  changes_notify_alerts:
    class: Changes::NotifyAlertsJob
    queue: default
    schedule: every day at 8:30am
  payments_check_delays:
    class: Payments::CheckDelaysJob
    queue: default
    schedule: every day at 8am
  approvals_process_due:
    class: Approvals::ProcessDueJob
    queue: default
    schedule: every hour
  agent_retention:
    class: Agent::RetentionJob
    queue: agent_batch
    schedule: every day at 3am
  agent_digest:
    class: Agent::DigestJob
    queue: agent_batch
    schedule: every hour
  generate_recurring_invoices:
    class: Accounting::GenerateRecurringInvoicesJob
    queue: default
    schedule: every day at 5am
  consistency_checks:
    class: Accounting::ConsistencyCheckJob
    queue: default
    schedule: every day at 2am
  pull_received_peppol:
    class: Peppol::PullReceivedJob
    queue: default
    schedule: every 15 minutes
  task_due_reminders:
    class: Accounting::TaskDueRemindersJob
    queue: default
    schedule: every day at 7am
  daily_task_digest:
    class: Accounting::DailyTaskDigestJob
    queue: default
    schedule: every day at 7:30am
  generate_recurring_entries:
    class: Accounting::GenerateRecurringEntriesJob
    queue: default
    schedule: every day at 5:30am
  auto_reverse_entries:
    class: Accounting::AutoReverseEntriesJob
    queue: default
    schedule: every day at 4am
  suggest_letterings:
    class: Accounting::SuggestLetteringsJob
    queue: default
    schedule: every day at 1am
  purge_expired_backups:
    class: Exports::PurgeExpiredJob
    queue: default
    schedule: every day at 3am
  purge_idempotency_keys:
    class: Api::PurgeIdempotencyKeysJob
    queue: default
    schedule: every day at 3:30am
  portfolio_snapshots:
    class: Portfolio::SnapshotAllJob
    queue: default
    schedule: every day at 1:30am
  relock_periods:
    class: Accounting::RelockPeriodsJob
    queue: default
    schedule: every 10 minutes
  verify_documents:
    class: Accounting::VerifyDocumentsJob
    queue: default
    schedule: every sunday at 3am
  dunning_promises:
    class: Accounting::DunningPromisesJob
    queue: default
    schedule: every day at 6am
  dunning_auto_send:
    class: Accounting::DunningAutoSendJob
    queue: default
    schedule: every day at 8am
  import_exchange_rates:
    class: Rates::ImportJob
    queue: default
    schedule: every day at 6pm
  portal_mirror_events:
    class: PortalAdminJob
    args: [ "mirror" ]
    queue: default
    schedule: every minute
  portal_receive_uploads:
    class: PortalAdminJob
    args: [ "uploads" ]
    queue: default
    schedule: every minute
  portal_remind_document_requests:
    class: PortalAdminJob
    args: [ "reminders" ]
    queue: default
    schedule: every day at 8am
  portal_snapshots:
    class: PortalAdminJob
    args: [ "snapshots" ]
    queue: default
    schedule: every day at 3am
  portal_suspend_dormant:
    class: PortalAdminJob
    args: [ "dormant" ]
    queue: default
    schedule: every day at 2am
  portal_daily_digest:
    class: PortalAdminJob
    args: [ "digest" ]
    queue: default
    schedule: every day at 7am
