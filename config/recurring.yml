# Recurring tasks run by Solid Queue (inside Puma when SOLID_QUEUE_IN_PUMA is set). Development and test do not schedule
# anything: run a job by hand, e.g. `bin/rails runner 'Accounting::GenerateRecurringInvoicesJob.perform_now'`.
production:
  generate_recurring_invoices:
    class: Accounting::GenerateRecurringInvoicesJob
    queue: default
    schedule: every day at 5am
